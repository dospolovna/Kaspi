<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Клиенту Kaspi</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #fff;
      color: #111;
      font-family: -apple-system, BlinkMacSystemFont,
                   "Segoe UI", Arial, sans-serif;
    }

    .page {
      max-width: 440px;
      margin: auto;
      padding: 20px 14px;
    }

    h1 {
      margin: 0 0 35px;
      text-align: center;
      font-size: 21px;
      font-weight: 600;
    }

    .field {
      position: relative;
      display: flex;
      align-items: center;
      height: 68px;
      margin-bottom: 24px;
      padding: 0 15px;
      border-radius: 12px;
      background: #f0f1f4;
    }

    .field::after {
      content: "";
      position: absolute;
      left: 15px;
      right: 15px;
      bottom: 2px;
      height: 2px;
      background: #0964e8;
      transform: scaleX(0);
      transform-origin: left;
      transition: transform .12s ease;
    }

    .field:focus-within::after {
      transform: scaleX(1);
    }

    input {
      min-width: 0;
      margin: 0;
      padding: 0;
      border: none;
      outline: none;
      background: transparent;
      color: #111;
      caret-color: #0964e8;
      font: inherit;
      font-size: 17px;
      box-shadow: none;
    }

    .phone-label {
      position: absolute;
      top: 50%;
      left: 15px;
      right: 48px;
      transform: translateY(-50%);
      color: #858585;
      font-size: 16px;
      line-height: 24px;
      pointer-events: none;
      transition: .12s ease;
    }

    .phone-field:focus-within .phone-label,
    .phone-field.has-value .phone-label {
      top: 10px;
      transform: none;
      font-size: 13px;
      line-height: 16px;
    }

    .phone-field:focus-within .phone-label {
      color: #0964e8;
    }

    #phone {
      position: absolute;
      left: 15px;
      bottom: 8px;
      width: calc(100% - 67px);
      height: 24px;
      font-variant-numeric: tabular-nums;
    }

    .contact-icon {
      position: absolute;
      right: 15px;
      width: 23px;
      height: 23px;
      color: #ed4438;
    }

    .amount-field {
      gap: 3px;
      font-size: 21px;
    }

    #amount {
      width: calc(var(--length, 1) * 1ch + 2px);
      max-width: calc(100% - 25px);
      font-size: 21px;
      font-variant-numeric: tabular-nums;
    }

    #amount::placeholder {
      color: #111;
      opacity: 1;
    }
  </style>
</head>

<body>
  <main class="page">
    <h1>Клиенту Kaspi</h1>

    <label class="field phone-field" id="phone-field">
      <span class="phone-label" id="phone-label">
        Телефон получателя
      </span>

      <input
        id="phone"
        type="tel"
        inputmode="numeric"
        autocomplete="off"
        aria-labelledby="phone-label"
      >

      <svg class="contact-icon"
           viewBox="0 0 24 24"
           fill="none"
           stroke="currentColor"
           stroke-width="1.8"
           aria-hidden="true">
        <circle cx="12" cy="12" r="10"/>
        <circle cx="12" cy="9" r="3.5"
                fill="currentColor" stroke="none"/>
        <path d="M5 18a7.5 7.5 0 0 1 14 0"
              fill="currentColor" stroke="none"/>
      </svg>
    </label>

    <label class="field amount-field">
      <input
        id="amount"
        type="text"
        inputmode="numeric"
        maxlength="12"
        autocomplete="off"
        placeholder="0"
        aria-label="Сумма перевода"
      >
      <span aria-hidden="true">₸</span>
    </label>
  </main>

  <script>
    const phone = document.getElementById("phone");
    const phoneField = document.getElementById("phone-field");
    const amount = document.getElementById("amount");

    const slots = [4, 5, 6, 9, 10, 11, 13, 14, 16, 17];

    let digits = "";
    let focused = false;

    function normalizePhone(text) {
      let number = text.replace(/[^0-9]/g, "");

      if (
        text.trimStart().startsWith("+7") ||
        (number.length >= 11 && /^[78]/.test(number))
      ) {
        number = number.slice(1);
      }

      return number.slice(0, 10);
    }

    function digitIndex(position) {
      return Math.min(
        digits.length,
        slots.filter(slot => slot < position).length
      );
    }

    function setCaret(index) {
      index = Math.max(0, Math.min(index, digits.length));

      const position = index === 10 ? 18 : slots[index];

      phone.setSelectionRange(position, position);
    }

    function renderPhone(caretIndex = null) {
      const mask =
        "+7 (" +
        digits.slice(0, 3).padEnd(3, " ") +
        ") " +
        digits.slice(3, 6).padEnd(3, " ") +
        "-" +
        digits.slice(6, 8).padEnd(2, " ") +
        "-" +
        digits.slice(8, 10).padEnd(2, " ");

      phone.value = focused || digits ? mask : "";

      phoneField.classList.toggle(
        "has-value",
        digits.length > 0
      );

      if (focused && caretIndex !== null) {
        setCaret(caretIndex);
      }
    }

    function editPhone(kind, text = "") {
      const selectionStart = phone.selectionStart ?? 4;
      const selectionEnd = phone.selectionEnd ?? selectionStart;

      let start = digitIndex(selectionStart);
      let end = digitIndex(selectionEnd);
      let incoming = "";

      if (kind.startsWith("delete")) {
        if (
          start === end &&
          selectionStart === selectionEnd
        ) {
          if (kind.includes("WordBackward")) {
            start = 0;
          } else if (kind.includes("WordForward")) {
            end = digits.length;
          } else if (kind.endsWith("Backward")) {
            start = Math.max(0, start - 1);
          } else if (kind.endsWith("Forward")) {
            end = Math.min(digits.length, end + 1);
          }
        }
      } else {
        incoming = text.length > 1
          ? normalizePhone(text)
          : text.replace(/[^0-9]/g, "");

        if (!incoming) return;
      }

      digits = (
        digits.slice(0, start) +
        incoming +
        digits.slice(end)
      ).slice(0, 10);

      renderPhone(
        Math.min(start + incoming.length, digits.length)
      );
    }

    phone.addEventListener("focus", () => {
      focused = true;
      renderPhone(digits.length);
    });

    phone.addEventListener("blur", () => {
      focused = false;
      renderPhone();
    });

    phone.addEventListener("click", () => {
      if (phone.selectionStart === phone.selectionEnd) {
        setCaret(digitIndex(phone.selectionStart));
      }
    });

    phone.addEventListener("beforeinput", event => {
      if (event.isComposing) return;

      const kind = event.inputType || "";

      if (
        kind.startsWith("delete") ||
        (
          kind.startsWith("insert") &&
          event.data != null
        )
      ) {
        event.preventDefault();
        editPhone(kind, event.data || "");
      }
    });

    phone.addEventListener("paste", event => {
      if (!event.clipboardData) return;

      event.preventDefault();

      editPhone(
        "insertFromPaste",
        event.clipboardData.getData("text")
      );
    });

    phone.addEventListener("keydown", event => {
      if (
        event.key !== "Backspace" &&
        event.key !== "Delete"
      ) {
        return;
      }

      event.preventDefault();

      const word = event.ctrlKey || event.metaKey;

      const kind = event.key === "Backspace"
        ? (word ? "deleteWordBackward" : "deleteContentBackward")
        : (word ? "deleteWordForward" : "deleteContentForward");

      editPhone(kind);
    });

    phone.addEventListener("input", () => {
      const raw = phone.value;
      const caret = phone.selectionStart ?? raw.length;
      const allDigits = raw.replace(/[^0-9]/g, "");

      let before = raw
        .slice(0, caret)
        .replace(/[^0-9]/g, "")
        .length;

      if (
        raw.trimStart().startsWith("+7") ||
        (allDigits.length >= 11 && /^[78]/.test(allDigits))
      ) {
        before = Math.max(0, before - 1);
      }

      digits = normalizePhone(raw);

      renderPhone(Math.min(before, digits.length));
    });

    amount.addEventListener("beforeinput", event => {
      if (
        !event.isComposing &&
        event.inputType === "insertText" &&
        event.data &&
        /[^0-9]/.test(event.data)
      ) {
        event.preventDefault();
      }
    });

    amount.addEventListener("input", () => {
      const raw = amount.value;
      const caret = amount.selectionStart ?? raw.length;
      const clean = raw.replace(/[^0-9]/g, "").slice(0, 12);

      if (clean !== raw) {
        const position = Math.min(
          raw.slice(0, caret).replace(/[^0-9]/g, "").length,
          clean.length
        );

        amount.value = clean;
        amount.setSelectionRange(position, position);
      }

      amount.style.setProperty(
        "--length",
        Math.max(1, clean.length)
      );
    });
  </script>
</body>
</html>
