        </svg>
      </div>
      <h2 class="name">Арман Т.</h2>
    </section>
    <section class="pin-area">
      <h1 id="pin-title">Код доступа</h1>
      <div class="dots" id="dots-container" role="img" aria-label="Введено 0 из 4 цифр">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
      </div>
      <div class="loader-slot">
        <div class="spinner" id="spinner" aria-hidden="true" hidden>
          <svg viewBox="0 0 26 26"><path d="M13 2.5a10.5 10.5 0 1 1-10.5 10.5"/></svg>
        </div>
      </div>
    </section>
    <section class="keypad" id="keypad" aria-label="Цифровая клавиатура">
      <button class="key" type="button" data-key>1</button>
      <button class="key" type="button" data-key>2</button>
      <button class="key" type="button" data-key>3</button>
      <button class="key" type="button" data-key>4</button>
      <button class="key" type="button" data-key>5</button>
      <button class="key" type="button" data-key>6</button>
      <button class="key" type="button" data-key>7</button>
      <button class="key" type="button" data-key>8</button>
      <button class="key" type="button" data-key>9</button>
      <button class="key" id="face-btn" type="button" aria-label="Face ID">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M7 3H5a2 2 0 0 0-2 2v2m14-4h2a2 2 0 0 1 2 2v2M3 17v2a2 2 0 0 0 2 2h2m10 0h2a2 2 0 0 0 2-2v-2M8 9v2m8-2v2M12 9v5h-1m-3 2c2 2 6 2 8 0"/></svg>
      </button>
      <button class="key" type="button" data-key>0</button>
      <button class="key delete" id="delete-btn" type="button" aria-label="Удалить последнюю цифру" disabled>
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m12 9 6 6m0-6-6 6M9 5h11a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H9l-7-7 7-7Z"/></svg>
      </button>
    </section>
    <button class="forgot" id="forgot-btn" type="button">Забыли код доступа?</button>
    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    <p class="sr-only" id="pin-status" role="status" aria-live="polite"></p>
  </main>
  </div>
  <div class="loading-overlay" id="loading-overlay" aria-hidden="true" hidden></div>
  </div>
  <script src="./script.js" defer></script>
</body>
</html>
